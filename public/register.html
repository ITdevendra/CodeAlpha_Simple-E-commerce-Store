<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Simple Store</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <h1>Simple Store</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/cart.html">Cart</a>
            <a href="/login.html">Login</a>
        </nav>
    </header>

    <main class="auth-container">

        <h2>Create Account</h2>

        <form id="register-form">

            <div>
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div>
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="/login.html">Login</a>
        </p>

    </main>

    <script src="/js/register.js"></script>

</body>

</html>
