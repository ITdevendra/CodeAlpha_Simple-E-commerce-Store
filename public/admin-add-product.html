<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product - Admin</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <header>

        <h1>
            Add Product
        </h1>


        <nav id="admin-navbar">

            <a href="/admin-dashboard.html">
                Dashboard
            </a>

            <a href="/admin-products.html">
                Products
            </a>

            <a href="/admin-orders.html">
                Orders
            </a>

            <a href="/">
                Store
            </a>

            <button id="logout-button">
                Logout
            </button>

        </nav>

    </header>


    <main>

        <div class="auth-container">

            <h2>
                Add New Product
            </h2>


            <form id="add-product-form">


                <div>

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div>

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        required
                    ></textarea>

                </div>


                <div>

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div>

                    <label for="image">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="image"
                        placeholder="https://example.com/image.jpg"
                        required
                    >

                </div>


                <div>

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        required
                    >

                </div>


                <div>

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        required
                    >

                </div>


                <button type="submit">
                    Add Product
                </button>


                <p id="product-message"></p>


            </form>

        </div>

    </main>


    <script src="/js/admin-auth.js"></script>

    <script src="/js/admin-add-product.js"></script>

</body>

</html>
