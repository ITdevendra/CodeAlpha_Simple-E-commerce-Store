<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Simple Store</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <h1>Simple Store</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/cart.html">Cart</a>
            <a href="/register.html">Register</a>
        </nav>
    </header>

    <main class="auth-container">

        <h2>Login</h2>

        <form id="login-form">

            <div>
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <div>
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p>
            Don't have an account?
            <a href="/register.html">
                Register
            </a>
        </p>

    </main>

    <script src="/js/login.js"></script>

</body>

</html>
